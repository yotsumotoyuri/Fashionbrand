services:
  - type: web
    name: your-app-name
    runtime: php
    buildCommand: "composer install && npm install && npm run build"
    # 現在のディレクトリ(.)を使ってパスを生成します
    startCommand: "mkdir -p /opt/render/project/src/database && touch /opt/render/project/src/database/database.sqlite && chmod 777 /opt/render/project/src/database/database.sqlite && php artisan migrate --force && php artisan serve --port $PORT"
    envVars:
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /opt/render/project/src/database/database.sqlite