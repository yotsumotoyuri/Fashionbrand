services:
  - type: web
    name: your-app-name
    env: docker
    buildCommand: "php artisan config:cache && composer install --no-dev --optimize-autoloader && php artisan migrate --force && npm install && npm run build"
    envVars:
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: myapp-db # ← 作成したPostgreSQLのサービス名
          property: connectionString