services:
  - type: web
    name: your-app-name
    runtime: php
    buildCommand: "chmod +x render-build.sh && ./render-build.sh"
    # 修正箇所：startCommand を組み込みサーバーに変更
    startCommand: "php artisan migrate --force && php -S 0.0.0.0:$PORT -t public"
    envVars:
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/lib/sqlite/database.sqlite # 永続化エリア推奨
      - key: APP_DEBUG
        value: "false"
      - key: APP_ENV
        value: "production"