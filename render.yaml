services:
  - type: web
    name: your-app-name
    runtime: php
    buildCommand: "composer install && npm install && npm run build"
    # 起動のたびにファイルを再作成し、誰でも読み書きできるようにする
    startCommand: "touch /tmp/database.sqlite && chmod 777 /tmp/database.sqlite && php artisan migrate --force && php artisan serve --port $PORT"
    envVars:
      - key: DB_CONNECTION
        value: sqlite