services:
  - type: web
    name: your-app-name
    runtime: php
    buildCommand: "composer install --no-dev --optimize-autoloader && npm install && npm run build && php artisan migrate --force"
    startCommand: "php artisan migrate --force && php -S 0.0.0.0:$PORT -t public"
    envVars:
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/lib/sqlite/database.sqlite # 永続化エリア推奨
      - key: APP_DEBUG
        value: "false"
      - key: APP_ENV
        value: "production"