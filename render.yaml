services:
  - type: web
    name: your-app-name
    runtime: php
    # ビルド時にファイルを作り、権限を与えておく
    buildCommand: "touch /tmp/database.sqlite && chmod 777 /tmp/database.sqlite && ..."
    # ここではマイグレーションのみ実行
    startCommand: "php artisan migrate --force && php artisan serve --port $PORT"
    envVars:
      - key: DB_CONNECTION
        value: sqlite