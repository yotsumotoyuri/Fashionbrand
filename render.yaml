services:
  - type: web
    name: your-app-name
    runtime: php
    buildCommand: "composer install && npm install && npm run build"
    startCommand: "php artisan config:clear && php artisan cache:clear && chmod -R 777 database && php artisan migrate --force && php artisan serve --port $PORT"
    envVars:
      - key: DB_CONNECTION
        value: sqlite