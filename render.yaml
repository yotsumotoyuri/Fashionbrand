services:
  - type: web
    name: your-app-name
    runtime: php
    buildCommand: "composer install && npm install && npm run build"
    # ファイル作成は行わず、マイグレーションのみ実行
    startCommand: "php artisan migrate --force && php artisan serve --port $PORT"
    envVars:
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /opt/render/project/src/database/database.sqlite